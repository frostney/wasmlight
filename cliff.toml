# git-cliff configuration for wasmlight's CHANGELOG.md.
#
# wasmlight uses Conventional Commits from the first commit, so unlike lwpt's
# verb-binning parsers this config maps commit types directly to
# changelog sections. Preview locally with:
#
#   git-cliff --latest --strip header        # just the latest tag's entries
#   git-cliff -o CHANGELOG.md                # regenerate the whole file

[changelog]
header = """
# Changelog

All notable changes to wasmlight are documented in this file. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/); entries are generated from Conventional Commits by git-cliff.
"""
body = """
{{ "\n" -}}
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = false
postprocessors = [
  { pattern = "\\n+$", replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
tag_pattern = "^v?[0-9]+\\.[0-9]+\\.[0-9]+(-.*)?$"
sort_commits = "newest"

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Initial commit$", skip = true },
  { message = "^(Complete section body decoding|Validation and IR|Interpreter|Runner|SIMD|Embedding|JIT part 1|More JIT|Even more JIT|AOT)", group = "New Features" },
  { message = "^Bugfixes$", group = "Bug Fixes" },
  { message = "^Doc updates$", group = "Documentation" },
  { message = "^bench", group = "Performance" },
  { message = "^feat",     group = "New Features" },
  { message = "^fix",      group = "Bug Fixes" },
  { message = "^perf",     group = "Performance" },
  { message = "^docs",     group = "Documentation" },
  { message = "^refactor", group = "Internal" },
  { message = "^test",     group = "Internal" },
  { message = "^build",    group = "Internal" },
  { message = "^ci",       group = "Internal" },
  { message = "^style",    group = "Internal" },
  { message = "^chore",    group = "Internal" },
  { message = "^revert",   group = "Reverts" },
  { message = ".*",        group = "Other Changes" },
]
