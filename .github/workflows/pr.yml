name: PR

# Fast PR gate. Mirrors the lwpt / duetto pattern: ci.yml runs only on
# push to main, so pr.yml is the sole pre-merge signal a PR sees.
#
#   pr.yml — every PR: install --frozen + format --check + build + test
#            on one Linux, one macOS, and both Windows targets. The
#            Windows legs are here rather than post-merge because the
#            {$IFDEF WINDOWS} paths never compile on the other legs.
#   ci.yml — push to main only: the full per-arch platform matrix.
#
# The lwpt toolchain comes from its published release (checksum-verified
# archive, no sibling checkout, no bootstrap); dependencies resolve from
# the same release tag and are verified against the committed lockfile +
# .lwpt/modules tree via install --frozen.

# No `branches:` filter on purpose. That key matches the pull request's BASE,
# so a stacked pull request — one whose base is the layer below it rather
# than main — was skipped entirely (the gap stack gh-15 hit on #13/#14).
# Every pull request runs this workflow whatever its base.
#
# Widening the trigger multiplies runs across a stack, so supersede rather
# than accumulate: a new push cancels the previous run for the same pull
# request, keeping the verdict attached to the current head.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LWPT_VERSION: "0.7.0"

jobs:
  # Branches come from main only. A PR head must CONTAIN the current default
  # branch tip: a stale base means the gate below tests a merge against code
  # nobody is shipping, and a native stack whose bottom layer squash-merges
  # leaves its upper layers stale until `gh stack sync` rebases them — this
  # job is what makes that sync non-optional rather than a convention.
  branch-freshness:
    name: branch contains main tip
    runs-on: ubuntu-latest
    steps:
      - name: Check the head descends from the default branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.repository.default_branch || 'main' }}" --jq '.sha')"
          git init -q .
          git fetch --no-tags --quiet "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$MAIN_SHA" "$HEAD_SHA"
          if git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then
            echo "HEAD $HEAD_SHA contains main ($MAIN_SHA)."
          else
            BASE="$(git merge-base "$HEAD_SHA" "$MAIN_SHA" || true)"
            echo "::error::Branch is not based on the current default branch tip (main $MAIN_SHA, divergence at ${BASE:-nothing}). Merge or rebase onto main — for a stack, run gh stack sync — and push."
            exit 1
          fi

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            lwpt-asset: linux-x64
            fpc-install: apt
            format-check: true   # platform-independent; one runner runs it
            jit: true            # 64-bit UNIX → JIT/AOT tiers active
          - runner: macos-latest
            lwpt-asset: macos-arm64
            fpc-install: brew
            jit: true
          - runner: windows-latest
            lwpt-asset: windows-x64
            lwpt-archive: zip
            fpc-install: installer
            fpc-win-target: x86_64-win64
            exe: .exe
          - runner: windows-latest
            lwpt-asset: windows-x86
            lwpt-archive: zip
            fpc-install: installer
            fpc-win-target: i386-win32
            exe: .exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install FPC (apt)
        if: matrix.fpc-install == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install FPC (brew)
        if: matrix.fpc-install == 'brew'
        run: |
          brew install fpc
          fpc -iV

      # One official installer carries native win32 and the win64 cross
      # set (choco's package is i386-only and downloads.freepascal.org
      # ships no Windows .exe for win64).
      - name: Install FPC (Windows combo installer)
        if: matrix.fpc-install == 'installer'
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe"
          Invoke-WebRequest -Uri $url -OutFile fpc-setup.exe -MaximumRedirection 10 -UserAgent "Wget/1.21"
          $f = Get-Item fpc-setup.exe
          Write-Host "downloaded $($f.Length) bytes"
          $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
          if ($hash -ne "8c255390544b051388b577eb61c6191a04883264afe0e3369b3600a56daf7bde") { Write-Error "installer SHA-256 mismatch: $hash"; exit 1 }
          $proc = Start-Process -Wait -PassThru -FilePath $f.FullName -ArgumentList "/VERYSILENT","/NORESTART","/SP-","/DIR=C:\fpc322"
          Write-Host "installer exit code $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { exit 1 }

      - name: Locate FPC (Windows)
        if: matrix.fpc-install == 'installer'
        run: |
          FPC_BIN=$(find /c/fpc322 -name fpc.exe -type f 2>/dev/null | head -1)
          if [ -z "$FPC_BIN" ]; then echo "::error::fpc.exe not found in the combo install"; exit 1; fi
          echo "Using FPC at $FPC_BIN"
          echo "$(dirname "$FPC_BIN")" >> "$GITHUB_PATH"
          echo "LWPT_FPC=$(cygpath -w "$FPC_BIN")" >> "$GITHUB_ENV"
          INSTANTFPC_BIN=$(find "$(dirname "$FPC_BIN")" -name instantfpc.exe -type f 2>/dev/null | head -1)
          if [ -n "$INSTANTFPC_BIN" ]; then
            echo "LWPT_INSTANTFPC=$(cygpath -w "$INSTANTFPC_BIN")" >> "$GITHUB_ENV"
          fi
          FPC_UNIT_PATHS=""
          for unit_dir in rtl rtl-objpas rtl-generics rtl-extra fcl-base fcl-process paszlib hash; do
            UNIT_PATH=""
            for unit_target in ${{ matrix.fpc-win-target }} i386-win32 x86_64-win64; do
              UNIT_PATH=$(find /c/fpc322 -path "*/units/${unit_target}/${unit_dir}" -type d 2>/dev/null | head -1 || true)
              if [ -n "$UNIT_PATH" ]; then break; fi
            done
            if [ -n "$UNIT_PATH" ]; then
              UNIT_PATH_WIN=$(cygpath -w "$UNIT_PATH")
              if [ -z "$FPC_UNIT_PATHS" ]; then
                FPC_UNIT_PATHS="$UNIT_PATH_WIN"
              else
                FPC_UNIT_PATHS="${FPC_UNIT_PATHS};${UNIT_PATH_WIN}"
              fi
            fi
          done
          echo "LWPT_FPC_UNIT_PATHS=$FPC_UNIT_PATHS" >> "$GITHUB_ENV"
          # win64 legs: the combo install's cross backend produces genuine
          # x86_64 binaries (fpc.exe defaults to i386-win32).
          if [ "${{ matrix.fpc-win-target }}" = "x86_64-win64" ]; then
            PPCX64=$(find /c/fpc322 -name ppcrossx64.exe -type f 2>/dev/null | head -1)
            if [ -z "$PPCX64" ]; then echo "::error::ppcrossx64.exe not found in the combo install"; exit 1; fi
            echo "LWPT_FPC=$(cygpath -w "$PPCX64")" >> "$GITHUB_ENV"
          fi

      - name: Install lwpt (release binary, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ASSET="lwpt-${LWPT_VERSION}-${{ matrix.lwpt-asset }}"
          BASE="https://github.com/frostney/lwpt/releases/download/${LWPT_VERSION}"
          EXT="tar.gz"
          if [ "${{ matrix.lwpt-archive }}" = "zip" ]; then EXT="zip"; fi
          curl -fsSLO "${BASE}/${ASSET}.${EXT}"
          curl -fsSLO "${BASE}/lwpt-${LWPT_VERSION}-checksums.txt"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c <(grep "${ASSET}.${EXT}" "lwpt-${LWPT_VERSION}-checksums.txt")
          else
            sha256sum -c <(grep "${ASSET}.${EXT}" "lwpt-${LWPT_VERSION}-checksums.txt")
          fi
          if [ "$EXT" = "zip" ]; then unzip -q "${ASSET}.zip"; else tar xzf "${ASSET}.tar.gz"; fi
          echo "$RUNNER_TEMP/${ASSET}" >> "$GITHUB_PATH"

      - name: lwpt install --frozen (verify lockfile + committed modules)
        run: lwpt install --frozen

      - name: lwpt format --check (formatting drift?)
        if: matrix.format-check == true
        run: lwpt format --check

      - name: lwpt agents --check (generated command reference)
        if: matrix.format-check == true
        run: lwpt agents --check

      - name: lwpt health (complexity ratchet)
        if: matrix.format-check == true
        run: lwpt health

      - name: lwpt duplication (clone ratchet)
        if: matrix.format-check == true
        run: lwpt duplication

      - name: lwpt build (compile every [build] entry)
        run: lwpt build

      - name: lwpt test (co-located unit suites)
        run: lwpt test

      # Smoke the shipped CLI surface: --version must report the manifest
      # version (the prebuild stamp), and a non-module must be rejected
      # with a nonzero exit rather than a crash.
      - name: wasmlight smoke
        run: |
          set -euo pipefail
          ./build/wasmlight${{ matrix.exe }} --version
          # A real compiled module whose data count section (id 12) precedes
          # its code section (id 10) — the case a decoder written on
          # increasing section ids rejects.
          ./build/wasmlight${{ matrix.exe }} inspect tests/fixtures/valid/datacount.wasm
          printf 'notwasm!' > "$RUNNER_TEMP/bad.wasm"
          if ./build/wasmlight${{ matrix.exe }} inspect "$RUNNER_TEMP/bad.wasm"; then
            echo "::error::a non-module was accepted"; exit 1
          fi

      # The runtime-shell template must exist, reject an empty embed, and
      # (on 64-bit UNIX) carry neither interpreter dispatch nor JIT
      # compile symbols, and no host compiler/linker/SDK libraries.
      - name: runtime-shell audit
        run: |
          set -euo pipefail
          SHELL_BIN=./build/wasmlight-shell${{ matrix.exe }}
          test -x "$SHELL_BIN"
          set +e
          "$SHELL_BIN" >"$RUNNER_TEMP/shell-empty.out" 2>"$RUNNER_TEMP/shell-empty.err"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::empty shell template exited 0"; exit 1
          fi
          if ! grep -q 'no embedded module' "$RUNNER_TEMP/shell-empty.err"; then
            echo "::error::empty shell template did not report a missing module"
            cat "$RUNNER_TEMP/shell-empty.err"
            exit 1
          fi
          # Black-box: incomplete native image is EWasmLinkError, no interp
          # fallback. Valid image (64-bit UNIX) runs _start natively.
          PY=python3
          if ! command -v python3 >/dev/null 2>&1; then PY=python; fi
          "$PY" scripts/write-wshl-payload.py --write-fixture-wasm \
            "$RUNNER_TEMP/shell-cmd.wasm" - "$RUNNER_TEMP/shell-incomplete.wshl"
          set +e
          "$SHELL_BIN" "$RUNNER_TEMP/shell-incomplete.wshl" \
            >"$RUNNER_TEMP/shell-incomplete.out" \
            2>"$RUNNER_TEMP/shell-incomplete.err"
          INC_STATUS=$?
          set -e
          if [ "$INC_STATUS" -eq 0 ]; then
            echo "::error::incomplete shell image exited 0"; exit 1
          fi
          if ! grep -q 'EWasmLinkError' "$RUNNER_TEMP/shell-incomplete.err"; then
            echo "::error::incomplete shell image was not a link error"
            cat "$RUNNER_TEMP/shell-incomplete.err"
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/shell-incomplete.out" ]; then
            echo "::error::incomplete shell image wrote stdout (interpreter fallback?)"
            cat "$RUNNER_TEMP/shell-incomplete.out"
            exit 1
          fi
          if [ "${{ matrix.jit }}" = "true" ]; then
            ./build/wasmlight aot "$RUNNER_TEMP/shell-cmd.wasm" \
              -o "$RUNNER_TEMP/shell-cmd.waot"
            "$PY" scripts/write-wshl-payload.py \
              "$RUNNER_TEMP/shell-cmd.wasm" "$RUNNER_TEMP/shell-cmd.waot" \
              "$RUNNER_TEMP/shell-complete.wshl"
            set +e
            "$SHELL_BIN" "$RUNNER_TEMP/shell-complete.wshl" \
              >"$RUNNER_TEMP/shell-complete.out" \
              2>"$RUNNER_TEMP/shell-complete.err"
            OK_STATUS=$?
            set -e
            if [ "$OK_STATUS" -ne 0 ]; then
              echo "::error::complete shell image failed"
              cat "$RUNNER_TEMP/shell-complete.err"
              exit 1
            fi
          fi
          if [ "${{ matrix.jit }}" = "true" ]; then
            if command -v nm >/dev/null 2>&1; then
              # Live symbols only. `nm -a` also prints DWARF names from
              # helper units the shell links for frames/traps; those are
              # not interpreter dispatch or JIT compile entry points.
              if nm "$SHELL_BIN" | grep -Ei 'JitCanCompile|JitStageFunctionBytes|JitForceCompile|JitCompileToBuffer|InterpTierInvoke'; then
                echo "::error::runtime shell contains interpreter dispatch or JIT compiler symbols"
                exit 1
              fi
            fi
            if command -v otool >/dev/null 2>&1; then
              DEPS=$(otool -L "$SHELL_BIN")
            elif command -v ldd >/dev/null 2>&1; then
              DEPS=$(ldd "$SHELL_BIN")
            else
              DEPS=""
            fi
            if printf '%s\n' "$DEPS" | grep -Ei 'libclang|libzig|libwasmer|zig'; then
              echo "::error::runtime shell links a host compiler, linker, or foreign runtime"
              echo "$DEPS"
              exit 1
            fi
          fi

      # The upstream conformance corpus is the project's strongest oracle.
      # It is fetched at a PINNED commit (never vendored — tests/spec/testsuite
      # is gitignored; the SHA lives in tests/spec/testsuite.commit so the
      # number is reproducible). The interpreter tier runs on EVERY platform;
      # on the 64-bit UNIX legs (matrix.jit) the baseline-JIT and AOT tiers
      # run too and must produce an IDENTICAL pass/fail/skip tally to the
      # interpreter — the observational-identity invariant (ADR-0001) that a
      # JIT or AOT codegen bug would break. errors=0 and a pass floor catch a
      # crash or a catastrophic interpreter regression without hardcoding a
      # count that shifts when a known-failing case is later closed.
      - name: Conformance corpus (wasmspec, all tiers)
        run: |
          set -euo pipefail
          COMMIT=$(tr -d '[:space:]' < tests/spec/testsuite.commit)
          git clone --filter=blob:none --quiet \
            https://github.com/WebAssembly/testsuite tests/spec/testsuite
          git -C tests/spec/testsuite checkout --quiet "$COMMIT"
          echo "testsuite @ $(git -C tests/spec/testsuite rev-parse HEAD)"
          WS=./build/wasmspec${{ matrix.exe }}
          FLOOR=64000
          run_tier() {
            local output_file total
            output_file="$RUNNER_TEMP/wasmspec-$1.txt"
            set +e
            "$WS" --failures-only --tier="$1" tests/spec/testsuite > "$output_file"
            set -e
            total=$(grep '^TOTAL' "$output_file" || true)
            if [ -z "$total" ]; then
              cat "$output_file" >&2
              echo "::error::$1 did not produce a TOTAL tally" >&2
              return 1
            fi
            printf '%s\n' "$total"
          }
          sig() { echo "$1" | grep -oE '(errors|pass|fail|skip)=[0-9]+' | sort | tr '\n' ' '; }
          field() { echo "$1" | grep -oE "$2=[0-9]+" | head -1 | cut -d= -f2; }
          IL=$(run_tier interp); echo "interp: $IL"
          [ "$(field "$IL" errors)" = "0" ] || { echo "::error::interp errors!=0"; exit 1; }
          [ "$(field "$IL" pass)" -ge "$FLOOR" ] || { echo "::error::interp pass below floor $FLOOR"; exit 1; }
          IS=$(sig "$IL")
          if [ "${{ matrix.jit }}" = "true" ]; then
            JL=$(run_tier jit); echo "jit:    $JL"
            AL=$(run_tier aot); echo "aot:    $AL"
            [ "$(field "$JL" errors)" = "0" ] || { echo "::error::jit errors!=0"; exit 1; }
            [ "$(field "$AL" errors)" = "0" ] || { echo "::error::aot errors!=0"; exit 1; }
            if [ "$(sig "$JL")" != "$IS" ]; then
              echo "::error::jit tally diverges from interpreter"
              diff -u "$RUNNER_TEMP/wasmspec-interp.txt" "$RUNNER_TEMP/wasmspec-jit.txt" || true
              exit 1
            fi
            if [ "$(sig "$AL")" != "$IS" ]; then
              echo "::error::aot tally diverges from interpreter"
              diff -u "$RUNNER_TEMP/wasmspec-interp.txt" "$RUNNER_TEMP/wasmspec-aot.txt" || true
              exit 1
            fi
            echo "three-tier identity OK"
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"

  # Same-runner base-vs-PR measurement, following GocciaScript's benchmark
  # reporting shape. The job is a correctness/executability gate: timing
  # deltas are reported, never asserted (VISION.md, "Honest measurement").
  runtime-comparison:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout main base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-source
          fetch-depth: 0
          persist-credentials: false

      - name: Restore pinned runtime executables
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/wasmlight-runtime-comparison
          key: runtime-comparison-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/runtime-comparison/install-ci-tools.sh') }}

      - name: Install pinned runtime executables
        run: |
          RUNTIME_TOOL_ROOT="$RUNNER_TOOL_CACHE/wasmlight-runtime-comparison"
          bash tools/runtime-comparison/install-ci-tools.sh "$RUNTIME_TOOL_ROOT"
          echo "$RUNTIME_TOOL_ROOT/bin" >> "$GITHUB_PATH"

      - name: Verify runtime executables
        run: |
          set -euo pipefail
          wasmtime --version
          wasmer --version
          wasmedge --version
          iwasm --version
          wamrc --version
          wazero version
          wasm3 2>&1 | head -1 || true
          wasm-tools --version
          wat2wasm --version

      - name: Install FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc
          fpc -iV

      - name: Install lwpt (release binary, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ASSET="lwpt-${LWPT_VERSION}-linux-x64"
          BASE="https://github.com/frostney/lwpt/releases/download/${LWPT_VERSION}"
          curl -fsSLO "${BASE}/${ASSET}.tar.gz"
          curl -fsSLO "${BASE}/lwpt-${LWPT_VERSION}-checksums.txt"
          sha256sum -c <(grep "${ASSET}.tar.gz" "lwpt-${LWPT_VERSION}-checksums.txt")
          tar xzf "${ASSET}.tar.gz"
          echo "$RUNNER_TEMP/${ASSET}" >> "$GITHUB_PATH"

      - name: Build release binaries for main and PR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wasmlight-binaries"

          (
            cd baseline-source
            lwpt install --frozen
            lwpt build --mode release
          )
          install -m 755 baseline-source/build/wasmlight \
            "$RUNNER_TEMP/wasmlight-binaries/main"

          lwpt install --frozen
          lwpt build --mode release
          install -m 755 build/wasmlight \
            "$RUNNER_TEMP/wasmlight-binaries/pr"

      - name: Measure main base
        run: |
          set -euo pipefail
          python3 tools/runtime-comparison/bench.py \
            --profile best \
            --samples 7 \
            --wasmlight "$RUNNER_TEMP/wasmlight-binaries/main" \
            --source-commit "${{ github.event.pull_request.base.sha }}"
          mkdir -p build/runtime-comparison-ci
          cp build/runtime-comparison/results.json \
            build/runtime-comparison-ci/main.json

      - name: Measure PR
        run: |
          set -euo pipefail
          python3 tools/runtime-comparison/bench.py \
            --profile best \
            --samples 7 \
            --wasmlight "$RUNNER_TEMP/wasmlight-binaries/pr" \
            --source-commit "${{ github.event.pull_request.head.sha }}"
          mkdir -p build/runtime-comparison-ci
          cp build/runtime-comparison/results.json \
            build/runtime-comparison-ci/pr.json

      - name: Upload raw runtime comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-comparison-results
          retention-days: 7
          if-no-files-found: ignore
          path: build/runtime-comparison-ci/*.json

  runtime-comparison-comment:
    needs: runtime-comparison
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download raw runtime comparison
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: runtime-comparison-results
          path: runtime-comparison-results

      - name: Render runtime comparison comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 tools/runtime-comparison/render_comment.py \
            --baseline runtime-comparison-results/main.json \
            --current runtime-comparison-results/pr.json \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --run-url "$RUN_URL" \
            --output runtime-comparison-comment.md

      - name: Upsert runtime comparison comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- wasmlight-runtime-comparison -->';
            const body = fs.readFileSync('runtime-comparison-comment.md', 'utf8');

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pull.head.sha !== process.env.EXPECTED_HEAD) {
              core.notice(`Skipping stale comparison for ${process.env.EXPECTED_HEAD}`);
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              comment => comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
