name: Wave 17 exact-source Linux core validation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  LWPT_VERSION: "0.6.0"
  SOURCE_COMMIT: "229695fcd63203593fac5401eb0b37871d03dffe"
jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 229695fcd63203593fac5401eb0b37871d03dffe
          persist-credentials: false
      - name: Record immutable source and native runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wave17-evidence/binaries"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(uname -m)" = x86_64
          test -z "$(git status --porcelain)"
          {
            date -u
            uname -a
            git rev-parse HEAD
            echo "workflow_ref=$GITHUB_WORKFLOW_REF"
            echo "workflow_sha=$GITHUB_SHA"
            echo "source_commit=$SOURCE_COMMIT"
            echo "environment=GitHub-hosted Ubuntu 24.04 x86_64; no performance measurements"
          } > "$RUNNER_TEMP/wave17-evidence/identity.log"
          git ls-files --stage > "$RUNNER_TEMP/wave17-evidence/source-index.txt"
          git ls-files -z | while IFS= read -r -d '' file; do
            if [ -L "$file" ]; then
              echo "$file -> $(readlink "$file")" >> "$RUNNER_TEMP/wave17-evidence/source-symlinks.txt"
            else
              sha256sum "$file"
            fi
          done > "$RUNNER_TEMP/wave17-evidence/source-files.sha256"
          git archive --format=tar -o "$RUNNER_TEMP/wave17-evidence/source.tar" HEAD
      - name: Install established released toolchain
        run: |
          set -euo pipefail
          sudo apt-get update > "$RUNNER_TEMP/wave17-evidence/apt-update.log" 2>&1
          sudo apt-get install -y fpc clang > "$RUNNER_TEMP/wave17-evidence/apt-install.log" 2>&1
          dpkg-query -W fp-compiler-3.2.2 fp-units-rtl-3.2.2 fp-units-fcl-3.2.2 clang > "$RUNNER_TEMP/wave17-evidence/fpc-packages.log"
          cd "$RUNNER_TEMP"
          ASSET="lwpt-${LWPT_VERSION}-linux-x64"
          BASE="https://github.com/frostney/lwpt/releases/download/${LWPT_VERSION}"
          curl --retry 3 -fsSLO "${BASE}/${ASSET}.tar.gz"
          curl --retry 3 -fsSLO "${BASE}/lwpt-${LWPT_VERSION}-checksums.txt"
          sha256sum -c <(grep "${ASSET}.tar.gz" "lwpt-${LWPT_VERSION}-checksums.txt") > wave17-evidence/lwpt-archive-verified.log
          tar xzf "${ASSET}.tar.gz"
          echo "$RUNNER_TEMP/${ASSET}" >> "$GITHUB_PATH"
          sha256sum "${ASSET}/lwpt" > wave17-evidence/lwpt-binary.sha256
          cp "lwpt-${LWPT_VERSION}-checksums.txt" wave17-evidence/
      - name: Exact-source build, unit and pinned-core gates
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wave17-evidence"
          lwpt --version > "$evidence/lwpt-version.log"
          run_gate() {
            local name="$1"
            shift
            "$@" > "$evidence/$name.log" 2>&1 || { cat "$evidence/$name.log"; return 1; }
            echo "$name passed"
          }
          run_gate install-frozen lwpt install --frozen
          run_gate format-check lwpt format --check
          run_gate agents-check lwpt agents --check
          run_gate focused-jit lwpt test source/units/Wasm.Jit.Arm64.Test.pas source/units/Wasm.Jit.Test.pas --jobs 1
          run_gate build-dev lwpt build --mode dev --clean --jobs 1
          run_gate build-release lwpt build --mode release --clean --jobs 1
          cp build/wasmlight build/wasmlight-shell build/wasmbench build/wasmspec "$evidence/binaries/"
          run_gate test-all lwpt test --jobs 1
          grep -F 'summary: 62 passed, 0 failed, 0 did not compile, 0 skipped, 0 cancelled' "$evidence/test-all.log" > "$evidence/unit-summary.txt"
          PIN=$(tr -d '[:space:]' < tests/spec/testsuite.commit)
          test "$PIN" = de54fd27ecf3e68dfd16b6199c548df77b6a2cc1
          git clone --quiet https://github.com/WebAssembly/testsuite tests/spec/testsuite
          git -C tests/spec/testsuite checkout --quiet "$PIN"
          test "$(git -C tests/spec/testsuite rev-parse HEAD)" = "$PIN"
          test -z "$(git -C tests/spec/testsuite status --porcelain)"
          set -- tests/spec/testsuite/*.wast
          test "$#" = 257
          git -C tests/spec/testsuite rev-parse HEAD > "$evidence/corpus-pin.txt"
          for tier in interp jit aot; do
            run_gate "conformance-$tier" ./build/wasmspec --failures-only --tier="$tier" "$@"
            total=$(grep '^TOTAL ' "$evidence/conformance-$tier.log")
            echo "$total" | tee -a "$evidence/corpus-summary.txt"
            test "$(echo "$total" | sed -E 's/ tier=[^ ]+//; s/ compiled=[0-9]+//')" = 'TOTAL files=257 errors=0 pass=65188 fail=0 skip=0 staged=0 total=65188'
          done
          sha256sum -c "$evidence/source-files.sha256" > "$evidence/source-unchanged.log"
          git diff --exit-code > "$evidence/final-source-diff.log"
          find .lwpt/sessions -name '*.log' -print0 | tar -czf "$evidence/lwpt-session-logs.tar.gz" --null -T -
      - name: Hash retained evidence
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/wave17-evidence"
          find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wave17-linux-core-229695f
          path: ${{ runner.temp }}/wave17-evidence
          if-no-files-found: error
          retention-days: 14
