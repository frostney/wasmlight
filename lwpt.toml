# wasmlight — WebAssembly runtime for Object Pascal.
# Manifest is the single source of truth; lwpt.cfg and lwpt.lock are
# generated by `lwpt install` and must never be hand-edited.

[package]
name = "wasmlight"
version = "0.1.0"
# Only wasmlight's own unit dir is listed — lwpt discovers dependency
# units through their nested manifests.
units = ["source/units"]

[dependencies]
# Resolved from the lwpt release tag via include filters (one filtered
# fetch per package). `testing` is the assertion/suite/runner framework
# behind the co-located *.Test.pas suites; `cli` is the option parser and
# subcommand dispatcher the source/apps programs build their flags on.
testing = { source = "frostney/lwpt", version = "^0.6.0", include = ["packages/testing/**"], exclude = ["**/*.Test.pas"] }
cli = { source = "frostney/lwpt", version = "^0.6.0", include = ["packages/cli/**"], exclude = ["**/*.Test.pas"] }

[build]
wasmlight = { source = "source/apps/wasmlight.pas", output = "build/wasmlight" }
wasmbench = { source = "source/apps/wasmbench.pas", output = "build/wasmbench" }
wasmspec = { source = "source/apps/wasmspec.pas", output = "build/wasmspec" }
# Interpreter-free runtime-shell template (#34). Smart-link so unused
# interpreter-dispatch and JIT-emit routines from helper units are not
# retained; the shell never calls those entry points. `-dWASM_RUNTIME_SHELL`
# is required so Wasm.Engine omits RegisterInterpreter / InterpInvoke —
# a program-file {$DEFINE} does not reach units, and GNU ld keeps
# InterpTierInvoke unless that uses-clause is gone.
wasmlight-shell = { source = "source/apps/wasmlight-shell.pas", output = "build/wasmlight-shell", flags = ["-CX", "-XX", "-dWASM_RUNTIME_SHELL"] }

# stamp-version derives source/units/Version.inc from this manifest's
# [package].version, consumed by Wasm.Core's `{$I Version.inc}`. The
# manifest stays the single source of truth for `wasmlight --version`.
# The generated file is committed so a fresh clone compiles before any
# hook runs; the hooks keep it in step. Registered on both build and test
# because the test programs compile Wasm.Core too.
[prebuild]
stamp-version = { command = "instantfpc",
                  args = ["scripts/stamp-version.pas"],
                  inputs = ["lwpt.toml"],
                  output = "source/units/Version.inc" }

[pretest]
stamp-version = { command = "instantfpc",
                  args = ["scripts/stamp-version.pas"],
                  inputs = ["lwpt.toml"],
                  output = "source/units/Version.inc" }

# The formatter's scope is seeded by [package].units. scripts/ holds
# project-owned Pascal that is not a unit, so it is added explicitly.
[format]
include = ["scripts/*.pas"]

# Analysis gates. Every limit sits just above the measured baseline
# (lwpt health / lwpt duplication, 2026-08 audit): file cyclomatic 1147,
# file cognitive 988, routine cyclomatic 497, routine cognitive 182,
# duplication 9.3%. These are regression ratchets — CI fails when a
# change pushes a metric past its ceiling; lowering a ceiling IS the
# follow-up refactor, never a drive-by edit.
[health]
max-file-cyclomatic = 1200
max-file-cognitive = 1050
max-routine-cyclomatic = 520
max-routine-cognitive = 200

[duplication]
maximum-percent = 10
