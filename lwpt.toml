# wasmlight — WebAssembly runtime for Object Pascal.
# Manifest is the single source of truth; lwpt.cfg and lwpt.lock are
# generated by `lwpt install` and must never be hand-edited.

[package]
name = "wasmlight"
version = "0.1.0"
# Only wasmlight's own unit dir is listed — lwpt discovers dependency
# units through their nested manifests.
units = ["source/units"]

[dependencies]
# Resolved from the lwpt release tag via include filters (one filtered
# fetch per package). `testing` is the assertion/suite/runner framework
# behind the co-located *.Test.pas suites; `cli` is the option parser and
# subcommand dispatcher the source/apps programs build their flags on.
testing = { source = "frostney/lwpt", version = "^0.4.0", include = ["packages/testing/**"], exclude = ["**/*.Test.pas"] }
cli = { source = "frostney/lwpt", version = "^0.4.0", include = ["packages/cli/**"], exclude = ["**/*.Test.pas"] }

[build]
wasmlight = { source = "source/apps/wasmlight.pas", output = "build/wasmlight" }
wasmbench = { source = "source/apps/wasmbench.pas", output = "build/wasmbench" }

# stamp-version derives source/units/Version.inc from this manifest's
# [package].version, consumed by Wasm.Core's `{$I Version.inc}`. The
# manifest stays the single source of truth for `wasmlight --version`.
# The generated file is committed so a fresh clone compiles before any
# hook runs; the hooks keep it in step. Registered on both build and test
# because the test programs compile Wasm.Core too.
[prebuild]
stamp-version = { script = "scripts/stamp-version.pas",
                  inputs = ["lwpt.toml"],
                  output = "source/units/Version.inc" }

[pretest]
stamp-version = { script = "scripts/stamp-version.pas",
                  inputs = ["lwpt.toml"],
                  output = "source/units/Version.inc" }

# The formatter's scope is seeded by [package].units. scripts/ holds
# project-owned Pascal that is not a unit, so it is added explicitly.
[format]
include = ["scripts/*.pas"]
