# wasi-testsuite Preview 1 baseline for wasmlight on linux.
# Format: upstream wasi-testsuite expectations (version 1).
# Corpus: tests/spec/wasi (see PROVENANCE.md). Runner: tools/wasi-testsuite/run.py.
#
# Expected failures carry the issue that owns the WASI function they exercise.
# Remove an entry when its test passes: run.py reports it as an unexpected pass.
# Unsupported (sockets) cases are skipped and are not failures.

version = 1

[[suite]]
name = "WASI C tests [wasm32-wasip1]"

# --- #79: positional I/O, fd_tell, fd_renumber, fd_seek hardening ---
# #79: fd_pread
[[suite.test]]
name = "pread-with-access"
expected = "fail"

# #79: fd_pwrite
[[suite.test]]
name = "pwrite-with-access"
expected = "fail"

# #79: fd_pwrite
[[suite.test]]
name = "pwrite-with-append"
expected = "fail"

# --- #80: allocation, sync, flags, rights, timestamps ---
# #80: fd_fdstat_set_flags
[[suite.test]]
name = "fopen-with-access"
expected = "fail"

# #80: fd_fdstat_set_flags
[[suite.test]]
name = "fopen-with-no-access"
expected = "fail"

# #80: fd_fdstat_set_flags (imported by libc fopen)
[[suite.test]]
name = "lseek"
expected = "fail"

# --- Unsupported: sockets are outside the non-network Preview 1 scope (#78). Not failures. ---
# unsupported: sock_shutdown
[[suite.test]]
name = "sock_shutdown-invalid_fd"
action = "skip"

# unsupported: sock_shutdown
[[suite.test]]
name = "sock_shutdown-not_sock"
action = "skip"

